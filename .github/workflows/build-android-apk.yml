name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-android-apk.yml"
      - "notifications-bridge.js"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "economic-calendar.js"
      - "labor-dashboard.js"
      - "panel-collapse.js"
      - "voice-assistant.js"
      - "manifest.webmanifest"
      - "icon.svg"
      - "icon-192.png"
      - "icon-512.png"
      - "logo-wide.png"
      - "sw.js"

permissions:
  contents: read

jobs:
  build:
    name: Package installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out app
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Bundle app assets
        shell: bash
        run: |
          mkdir -p www
          cp index.html app.js styles.css economic-calendar.js labor-dashboard.js panel-collapse.js voice-assistant.js manifest.webmanifest icon.svg icon-192.png icon-512.png logo-wide.png sw.js www/
          npx esbuild notifications-bridge.js --bundle --format=iife --outfile=www/capacitor-notifications.bundle.js

      - name: Create Android project and build APK
        shell: bash
        run: |
          npx cap add android
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: khendzodsit-ai-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
